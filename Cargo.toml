[package]
name = "mc-minder"
version = "0.4.4"
edition = "2021"
authors = ["SharkMI-0x7E"]
description = "A smart management suite for Minecraft Fabric servers on Linux/Termux/Android"
license = "MIT"
repository = "https://github.com/SharkMI-0x7E/mc-minder"
readme = "README.md"
homepage = "https://github.com/SharkMI-0x7E/mc-minder"
documentation = "https://docs.rs/mc-minder"
keywords = ["minecraft", "server", "management", "rcon", "ai"]
categories = ["command-line-utilities", "games"]

[dependencies]
tokio = { version = "1.44", features = ["full", "signal", "process"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
byteorder = "1.5"
warp = "0.3"
notify = "8.2"
colored = "2.1"
dialoguer = "0.11"
ratatui = "0.28"
crossterm = "0.28"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
