# git-cliff configuration for mc-minder changelog generation
# Install: cargo install git-cliff
# Usage: git cliff -o CHANGELOG.md

[changelog]
header = "# Changelog\n\nAll notable changes to mc-minder.\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} \
  ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/SharkMI-0x7E/mc-minder/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "Feature" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI/CD" },
  { message = "^chore", group = "Chore" },
]
