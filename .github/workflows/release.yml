name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu

      - name: Build release binary
        run: cargo build --target ${{ matrix.target }} --release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary
        run: |
          mv target/${{ matrix.target }}/release/mc-minder mc-minder-${{ matrix.target }}
          chmod +x mc-minder-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-minder-${{ matrix.target }}
          path: mc-minder-${{ matrix.target }}

  build-termux:
    name: Build for Termux (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "NDK_HOME=$(pwd)/android-ndk-r26b" >> $GITHUB_ENV

      - name: Configure cargo for Android
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-linux-android]
          linker = "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          EOF

      - name: Build release binary
        run: cargo build --target aarch64-linux-android --release

      - name: Rename binary
        run: |
          mv target/aarch64-linux-android/release/mc-minder mc-minder-termux-aarch64
          chmod +x mc-minder-termux-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-minder-termux-aarch64
          path: mc-minder-termux-aarch64

  release:
    needs: [build-linux, build-termux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: MC-Minder ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## MC-Minder ${{ steps.get_version.outputs.VERSION }}
            
            ### 功能特性
            - 日志监控：使用 notify 库实时监控服务器日志，事件驱动，低 CPU 占用
            - AI 聊天机器人：支持 OpenAI API 和 Ollama，玩家使用 `!` 前缀触发
            - RCON 通信：异步 RCON 协议实现，自动重连
            - 上下文记忆：按玩家保存对话历史
            - HTTP API：RESTful API 用于状态查询和命令执行
            - 一键安装：交互式初始化配置
            - 自动更新：内置 self-update 命令
            
            ### 下载
            | 平台 | 文件 |
            |------|------|
            | Linux x64 | `mc-minder-x86_64-unknown-linux-gnu` |
            | Linux ARM64 | `mc-minder-aarch64-unknown-linux-gnu` |
            | Termux/Android ARM64 | `mc-minder-termux-aarch64` |
            
            ### 安装
            ```bash
            curl -fsSL https://raw.githubusercontent.com/SharkMI-0x7E/mc-minder/main/install.sh | bash
            ```
          files: |
            binaries/mc-minder-x86_64-unknown-linux-gnu/mc-minder-x86_64-unknown-linux-gnu
            binaries/mc-minder-aarch64-unknown-linux-gnu/mc-minder-aarch64-unknown-linux-gnu
            binaries/mc-minder-termux-aarch64/mc-minder-termux-aarch64
            install.sh
          draft: false
          prerelease: false
