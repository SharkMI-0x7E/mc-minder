name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --target ${{ matrix.target }} --release

      - name: Rename binary
        run: |
          mv target/${{ matrix.target }}/release/mc-minder mc-minder-${{ matrix.target }}
          chmod +x mc-minder-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-minder-${{ matrix.target }}
          path: mc-minder-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: mc-minder-x86_64-unknown-linux-musl
          path: ./binaries

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: MC-Minder ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## MC-Minder ${{ steps.get_version.outputs.VERSION }}
            
            ### 功能特性
            - 日志监控：使用 notify 库实时监控服务器日志，事件驱动，低 CPU 占用
            - AI 聊天机器人：支持 OpenAI API 和 Ollama，玩家使用 `!` 前缀触发
            - RCON 通信：异步 RCON 协议实现，自动重连
            - 上下文记忆：按玩家保存对话历史
            - HTTP API：RESTful API 用于状态查询和命令执行
            - 一键安装：交互式初始化配置
            - 自动更新：内置 self-update 命令
            
            ### 下载
            | 平台 | 文件 |
            |------|------|
            | x64 Linux | `mc-minder-x86_64-unknown-linux-musl` |
            
            ### 安装
            ```bash
            curl -fsSL https://raw.githubusercontent.com/SharkMI-0x7E/mc-minder/main/install.sh | bash
            ```
          files: |
            binaries/mc-minder-x86_64-unknown-linux-musl
            install.sh
          draft: false
          prerelease: false
